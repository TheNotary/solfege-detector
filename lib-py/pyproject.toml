[project]
name = "solfege-detector"
version = "0.1.0"
description = "Real-time solfege syllable detection using CLAP zero-shot audio classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  'setuptools',
  'msclap',
  'fastapi',
  'uvicorn[standard]',
  'websockets',
  'numpy',
  'soundfile',
  'torch>=2.1,<2.6',
  'torchaudio>=2.1,<2.6',
  'numba>=0.60,<0.61',
  'llvmlite>=0.43,<0.44',
]

[dependency-groups]
dev = [
    "pytest",
    "gTTS",
    "pydub",
]

[project.scripts]
solfege-detector = 'solfege_detector.main:main'

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

