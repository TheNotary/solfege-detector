In `test-client/src/views/GameView.tsx` (~lines 378-388), the `.debug-latency-offset` sub-band currently renders on the RIGHT side of the debug hit-zone (because latency was incorrectly shifting the zone right).

After the sign flip, latency shifts the zone LEFT. The purple band, which visualizes the portion 'reclaimed' by the latency offset, should render on the LEFT side:

```tsx
<div
  className="debug-latency-offset"
  style={{
    left: '0%',
    width: `${(debugHitZone.offsetPct / (debugHitZone.halfPct * 2)) * 100}%`,
  }}
/>
```

Depends on sign-flip task.
