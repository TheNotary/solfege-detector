Update `test-client/src/components/PitchBar.tsx` to accept dynamic scale frequencies instead of using hardcoded NOTE_POINTS.

**Changes:**
- Export a helper `buildNotePoints(scaleFrequencies: Record<Syllable, number>)` that generates the NOTE_POINTS array from dynamic frequencies, mapping each syllable to its evenly-spaced Y% position (do=85%, ti=15%, 11.667% apart)
- Update `freqToY(hz, notePoints)` to accept a `notePoints` parameter instead of referencing the module-level constant
- Update PitchBar props to accept `scaleFrequencies` (or pre-built `notePoints`) and thread them to `freqToY`
- Remove the hardcoded NOTE_POINTS constant (or keep as default fallback)

**File**: `test-client/src/components/PitchBar.tsx`
