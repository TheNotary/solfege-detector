## New: test-client/src/components/NoteSprite.tsx
- Renders a musical note symbol at given (x, y) position
- Position driven by game loop (absolute positioning within game area)
- On hit state: trigger canvas-confetti burst at note screen position, then fade/remove
- On missed state: fade out as it exits past the left edge

## New: test-client/src/views/GameView.css
- Dark background for game feel
- Glowing crosshair (CSS glow/shadow effect)
- Note styling with subtle shadow/glow
- Staff lines as thin, low-opacity horizontal rules
