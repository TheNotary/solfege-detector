Build the visual game components: the main game view, sliding note sprites, and styling.

## New: test-client/src/views/GameView.tsx
- Full-viewport game area (DOM-based, not HTML canvas)
- Renders NoteSprite for each active note from the game engine
- Renders crosshair overlay (vertical line or reticle at fixed X ~20% from left)
- Faint horizontal staff lines at each solfege Y position (barely visible, "invisible staff")
- Note labels on the left edge (Do, Re, Mi, Fa, Sol, La, Ti) to label staff lines
- Speed slider control (bottom or sidebar)
- Start/Stop button (reuse existing recording controls pattern)
- Connection status indicator (reuse existing)
