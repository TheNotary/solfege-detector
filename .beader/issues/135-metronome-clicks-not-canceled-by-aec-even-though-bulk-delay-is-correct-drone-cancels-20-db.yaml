Resolved at the consumer level via #136 (mask clicks from hit/onset/waveform paths) rather than improving AEC FIR convergence. With LatencyCalibrator (f9a85d8) measuring per-device round-trip delay, the click mask aligns correctly and suppresses spurious hits even when FBC is off. AEC FIR underconvergence on impulsive content remains as a known limitation but no longer surfaces as a user-visible bug.
