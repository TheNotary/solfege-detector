Companion feature #136 created with an alternative approach: consumer-side click masking in the volume/onset detectors and waveform render, rather than improving FIR convergence here. The user-visible bug (clicks triggering spurious note hits) is addressed in #136; the deeper FIR work (longer FIR / FDAF / broadband-trained seed) outlined in this issue remains valid follow-up if waveform-level click cancellation becomes important later.

