Create `accoustic-model/test_prompts.py` — a standalone script to test CLAP zero-shot classification on sample audio files before integrating into the library.

This script should:
- Load CLAP model (msclap v2023)
- Import prompts from `prompt_config.py`
- Accept audio file paths as CLI arguments
- Run zero-shot classification and print per-class probabilities
- Help iterate on prompt phrasing (e.g., "singing the note do" vs "the solfege syllable do" vs "a person vocalizing do")

This is a development/validation tool, not part of the production library.

**Files to create:** `accoustic-model/test_prompts.py`
**Depends on:** #4 (prompt config must exist first)

