## Summary
Make the pitch bar display correctly regardless of which octave the user sings in, and add a root-note text field (default "C3") to the HUD that drives the drone frequency, scale frequencies, and pitch-to-staff mapping.

## User Message
We need to improve test-client/. To allow players with differing vocal ranges to use the system.

- Make the pitch bar shows aligns to the scale no matter which octave the user is singing in.
- Add a text field to the top center HUD for specifying the root note of the Drone, and the scale expected. By default, this textbox should be set to "C3" by default.

## Plan

### Design Decisions

1. **Octave folding happens BEFORE smoothing** — detected pitch is folded into the root octave before useSmoothedPitch, so the smoother doesn't try to animate through octave-jump gaps. freqToY continues to do piecewise interpolation on (now dynamic) scale frequencies.
2. **Scale type stays major** — solfege is inherently a major scale (do-re-mi-fa-sol-la-ti = intervals [0, 2, 4, 5, 7, 9, 11] semitones). Only the root note is configurable.
3. **Single text field** — parses input like "C3", "D#4", "Bb2". Default "C3". Invalid input is ignored (keeps last valid value).
4. **Root note propagates as frequency** — a single rootFrequencyHz number threads through all hooks/components. A utility converts note name to frequency.

### Phases
1. Note Parsing Utility — new src/utils/noteUtils.ts
2. Dynamic PitchBar — update PitchBar.tsx with dynamic scale frequencies
3. Dynamic Drone — update useDrone.ts to accept configurable frequency
4. Dynamic Game Engine — update useGameEngine.ts with dynamic TARGET_FREQUENCIES
5. Root Note HUD + Wiring — update GameView.tsx with text field, octave folding, wiring
6. Adjust Smoothing Clamp — update useSmoothedPitch.ts with adaptive pitch range

### Relevant Files
- test-client/src/utils/noteUtils.ts (new)
- test-client/src/components/PitchBar.tsx
- test-client/src/hooks/useDrone.ts
- test-client/src/hooks/useGameEngine.ts
- test-client/src/hooks/useSmoothedPitch.ts
- test-client/src/views/GameView.tsx

### Verification
- cd test-client && npx tsc --noEmit passes
- Default C3: pitch bar aligns to staff as before
- Octave invariance: sing in C4/C5, pitch bar still aligns to correct solfege degree
- Root change: set root to "G3", drone changes to 196 Hz, staff frequencies update
- Invalid input: type garbage, last valid root preserved
- Drone restart: change root while drone active, drone restarts at new pitch

