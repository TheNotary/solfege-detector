Play a spa-like C3 drone (130.81 Hz) from the test-client to help the user calibrate their singing pitch.

## Goal
Provide a continuous, warm reference tone so the user knows what frequency to target when singing do. The drone uses Web Audio oscillators (no audio files) and shares the AudioContext with the mic capture system.

## Approach
- Create useDrone hook using OscillatorNode stack:
  - Fundamental: sine at 130.81 Hz (C3)
  - 2nd harmonic: sine at 261.63 Hz, gain -12dB (warmth)
  - 3rd harmonic: sine at 392.44 Hz, gain -18dB (subtle brightness)
  - Subtle LFO: 0.2 Hz, +/-2 cents on fundamental for gentle wavering pad effect
- Route through GainNode for volume control (default 0.15)
- Smooth 0.5s fade-in on start, 0.5s fade-out on stop (no clicks/pops)
- Exports: { startDrone, stopDrone, isDroning, setDroneVolume }
- Add drone toggle button to HUD (near speed slider)
- Add small volume slider (range 0-0.3, step 0.01)
- Reuse AudioContext from useAudioStream (avoid multiple contexts)
- Drone output goes to audioContext.destination directly (not through mic chain)

## Key Files
- test-client/src/hooks/useDrone.ts (NEW)
- test-client/src/hooks/useAudioStream.ts (expose AudioContext ref)
- test-client/src/views/GameView.tsx (drone toggle + volume slider)

## Verification
1. Toggle on -> hear continuous C3 tone with warm harmonic character
2. Tone is steady and spa-like (not harsh/buzzy)
3. Volume slider adjusts smoothly
4. Toggle off -> smooth fade-out, no click/pop
5. Drone does NOT interfere with mic detection (no feedback loop)
6. Game continues working normally while drone plays
