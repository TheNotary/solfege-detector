Implemented click-mask waveform blanking in WaveformCrosshair.tsx:

- Added two optional props (`clickMask`, `audioContext`) with a narrow inline `ClickMaskView` interface (just `getWindows()` returning `ReadonlyArray<{startAudioTime, endAudioTime}>`) so the component doesn't depend on the full `useClickMask` return shape.
- Mirrored both props into refs (`clickMaskRef`, `audioContextRef`) consumed by the long-running RAF closure, avoiding effect re-binding when settings flip.
- Inside the draw loop, after `getByteTimeDomainData(data)`, perform an inline two-pointer sweep over the (sorted) windows array. Each sample's mic-arrival time is `baseTime + i/sampleRate` where `baseTime = ctx.currentTime - (len - 1)/sampleRate`. Window pointer advances past any window whose `endAudioTime` is in the past relative to the current sample, never re-scanning. Masked samples are written as `128` (the centerline byte for `getByteTimeDomainData`), so the trace dips through centre on both the glow and core passes without further changes.
- No per-sample `isMaskedAt` calls; cost is O(len + windows) per frame.
- GameView passes `clickMask={settings.clickMaskEnabled ? clickMask : null}` and `audioContext={audioContext}` — when the toggle is off the mask becomes a no-op.

Verification:
- `pnpm exec tsc -b` → only the pre-existing TS6133 unused-symbol warnings.
- `pnpm test --run` → 37/37 passing.
