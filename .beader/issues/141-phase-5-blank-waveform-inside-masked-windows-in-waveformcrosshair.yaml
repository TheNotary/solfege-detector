Update test-client/src/components/WaveformCrosshair.tsx:

1. Accept new props: clickMask (the useClickMask return value) and audioContext.

2. Inside the per-frame draw loop (after getFloatTimeDomainData):
   - Each sample index i corresponds to mic-time: t_i = ctx.currentTime - (N - 1 - i) / ctx.sampleRate
   - For samples whose t_i falls inside an active mask window, set the sample value to 0 (Option A from plan — trace dips through centerline). Visually obvious and trivial.

3. Performance: the draw loop runs ~60 fps over thousands of samples. Do NOT call clickMask.isMaskedAt() per sample. Instead inline a two-pointer sweep over the (sorted) mask windows array, advancing the window pointer alongside the sample pointer.

Depends on Phase 4.

