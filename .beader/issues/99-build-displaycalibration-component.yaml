Create components/DisplayCalibration.tsx — the display latency calibration screen:

**Simplified staff:** Single horizontal line with a crosshair at 20% from left (reuses CROSSHAIR_X constant from useGameEngine).

**Sliding note:** A single note (musical note symbol) slides from right to left at moderate speed (~40 BPM equivalent). Uses requestAnimationFrame loop — much simpler than useGameEngine (single note, no scoring, no spawning).

**Spacebar listener:** keydown event handler on spacebar records performance.now() timestamp.

**Ground truth:** The note's exact crossing time through the crosshair center is known from the animation math: noteSpawnTime + (CROSSHAIR_X / 100) * travelTimeMs. This is computed when the note is spawned.

**Delta calculation:** spacebarTime - crosshairCrossingTime. Positive = user pressed late (display/reaction lag). Negative = user anticipated (valid). Collect 10 rounds.

**Results UI:** List of per-round deltas, highlight outliers (> 2 stddev from median), display median as the final offset. Save button writes displayLatencyMs to useGameSettings. Retry button resets.

**Visual feedback:** After each round, briefly show where the note was when spacebar was pressed (ghost/shadow) and where it should have been (at crosshair center) so the user can see their timing accuracy.

