In `test-client/src/lib/hitZoneGeometry.ts` line ~47, change `effectiveCenter = CROSSHAIR_X + offsetPct` to `effectiveCenter = CROSSHAIR_X - offsetPct`.

Notes slide right->left. Latency means sound is detected AFTER the note has moved past the visual crosshair. To compensate, the effective hit-zone must shift LEFT (lower %), not right. Positive `audioLatencyMs`/`displayLatencyMs` are recorded as positive deltas in AudioCalibration.tsx and DisplayCalibration.tsx (sound/perception arrives later than reality), confirming the sign.

This is the smallest change needed; subsequent tasks (test update, debug overlay flip, geometry unification) build on it.

