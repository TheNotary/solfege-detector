Update `test-client/src/hooks/useSmoothedPitch.ts` to accept adaptive pitch range bounds instead of the hardcoded 80-500 Hz clamp.

**Changes:**
- Add optional `minHz` and `maxHz` parameters to the hook (or derive them from a `rootHz` parameter)
- Replace the hardcoded `Math.max(80, Math.min(500, ...))` clamp with `Math.max(minHz, Math.min(maxHz, ...))`
- Reasonable defaults: `minHz = rootHz * 0.7`, `maxHz = rootHz * 2.2` (covers the full scale octave with some padding)
- Update `stateRef.current.currentPitch` initial value from hardcoded 130.81 to rootHz
- This ensures the smoother works correctly for higher roots (e.g., root G4 = 392 Hz would need a range up to ~860 Hz, well above the old 500 Hz cap)

**File**: `test-client/src/hooks/useSmoothedPitch.ts`
**Depends on**: #85 (GameView wiring determines what rootHz value is passed)

