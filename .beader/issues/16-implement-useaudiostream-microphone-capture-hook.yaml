Create `test-client/src/hooks/useAudioStream.ts` — custom React hook for capturing microphone audio and converting to PCM for streaming.

**API:**
- `useAudioStream(onChunk: (chunk: ArrayBuffer) => void)` returns:
  - `startRecording()` — requests mic permission, starts capture
  - `stopRecording()` — stops capture, releases mic
  - `isRecording: boolean`

**Implementation:**
- Uses `navigator.mediaDevices.getUserMedia({ audio: true })` to capture microphone
- Uses AudioWorkletNode (preferred) or ScriptProcessorNode (fallback) for raw audio access
- Resamples to 44100 Hz mono if device sample rate differs (Web Audio API provides float32 at device rate)
- Converts float32 → int16 PCM ArrayBuffer for transmission
- Calls `onChunk` callback every ~250ms with a PCM chunk
- Cleans up AudioContext and MediaStream on stop

**Wire format:** 16-bit signed integer, mono, 44100 Hz — matches server expectation.

**Files to create:** `test-client/src/hooks/useAudioStream.ts`

