Rewrite `test-client/src/views/Home.tsx` to be the main audio streaming UI.

**UI elements:**
- **Start/Stop button** — toggles microphone recording via useAudioStream
- **Confidence threshold slider** — range 0.0 to 1.0, default 0.5. Sends config update to server via WebSocket when changed
- **Connection status badge** — shows "Connected" (green) / "Disconnected" (red) based on WebSocket state
- **Detection log** — scrollable list showing detected syllables with confidence percentage and timestamp, newest first
- **Console logging** — every detection event is also logged via `console.log()` for debugging

**Integration:**
- Uses useWebSocket hook for server communication
- Uses useAudioStream hook for mic capture
- onChunk callback from useAudioStream sends PCM data via WebSocket send()
- On detection message received, appends to detection log and console.logs it

**Also update:**
- `test-client/src/AppConfig.ts` — ensure SOCKET_URL default is `ws://localhost:8000/ws`

**Files to modify:** `test-client/src/views/Home.tsx`, `test-client/src/AppConfig.ts`
**Depends on:** #15 (WebSocket hook), #16 (audio stream hook)

