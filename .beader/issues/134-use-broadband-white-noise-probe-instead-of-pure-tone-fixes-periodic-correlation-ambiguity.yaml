Diagnosis from bd #133 logs: 1500 Hz tone has 29.4-sample period at 44.1 kHz, cross-correlation was periodic with that period, picked the half-period peak (lag 13, anti-correlated). Replaced with broadband white-noise bursts. Now one sharp positive peak at the true round-trip delay should dominate.
