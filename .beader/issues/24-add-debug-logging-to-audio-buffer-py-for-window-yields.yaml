In lib-py/solfege_detector/audio_buffer.py, add debug logging when the buffer yields a window.

### Implementation
Add import logging at the top. Create logger = logging.getLogger(__name__).

In the append() method, add a logger.debug() call right before returning the window copy (line ~65):
- Log fill level (self._fill), new_samples accumulated since last yield, and window duration in seconds (self.window_samples / self.sample_rate)

### Example Output
  DEBUG solfege_detector.audio_buffer: Window yielded: fill=66150, new_samples=11025, duration=1.500s

### Acceptance Criteria
- Every window yield produces a debug log message
- Log includes fill level and computed window duration
- Logs only appear at DEBUG level

