Implemented in bd9840f. useAudioStream now accepts referenceNode/aecEnabled/audioInputLatencyMs and exposes a separate filteredAnalyserNode. AEC effect loads /aec-processor.js, builds a 2-in/1-out AudioWorkletNode, wires mic+reference, posts setLatency from settings.audioLatencyMs, and dispatches frame events to onVolumeFiltered (RMS) and onCaptureChunkFiltered (raw samples). Raw paths (analyser, scriptProcessor->onChunk->WebSocket, per-note capture) are untouched -- backend audio remains bit-identical. GameView adds a forward-declared state slot that bridges the reference-mix GainNode (created by useReferenceMix, which itself depends on the AudioContext created inside useAudioStream) back up to the recording hook. Build + 12/12 vitest pass.
