Create `lib-py/solfege_detector/audio_buffer.py` — sliding window ring buffer for streaming audio.

**AudioBuffer class:**
- Constructor params: `window_size_seconds` (default 7.0), `hop_size_seconds` (default 1.0), `sample_rate` (default 44100)
- `append(chunk: bytes) -> Optional[np.ndarray]`:
  - Accepts raw PCM bytes (16-bit signed int, mono)
  - Converts PCM int16 → float32 numpy array and appends to internal buffer
  - When enough new audio has accumulated (>= hop_size_seconds), returns a 7-second float32 numpy array
  - When insufficient new audio, returns None
  - Maintains a circular buffer that discards old audio beyond the window size
- Thread-safe for single-producer (WebSocket receive loop) use

**Wire format:** 16-bit signed integer, mono, 44100 Hz PCM — matches CLAP's native sample rate to avoid server-side resampling.

**Files to create:** `lib-py/solfege_detector/audio_buffer.py`
**Depends on:** #6 (numpy dependency)

