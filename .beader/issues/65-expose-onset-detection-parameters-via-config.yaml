Allow runtime configuration of onset detection parameters from the frontend via the existing WebSocket config JSON message, and accept them on the backend.

## Requirements
- New config keys accepted by backend:
  - `onset_sensitivity: float` (maps to librosa onset detection threshold, default 0.3)
  - `onset_min_gap_ms: int` (minimum ms between onsets, default 100)
  - `segment_mode: "latest" | "multi" | "off"` (default "latest")
    - "latest": detect() uses most recent onset segment (default behavior from #61)
    - "multi": detect_multi() classifies each segment independently (from #62)
    - "off": no onset segmentation, raw window passed to CLAP (original behavior)
- Frontend `sendConfig()` updated to include these new keys
- Backend sends `config_ack` including the new keys
- Parameters take effect on the next inference window (no restart required)

## Files
- `lib-py/solfege_detector/server.py` (backend config handler)
- `test-client/src/hooks/useWebSocket.ts` (frontend sendConfig)

## Dependencies
- Depends on: #61 (segment_mode "latest" must work)
- Depends on: #62 (segment_mode "multi" must work)

