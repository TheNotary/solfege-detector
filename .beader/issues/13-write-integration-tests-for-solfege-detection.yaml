Create `lib-py/solfege_detector/tests/test_integration.py` — integration tests that validate detection accuracy using the generated .mp3 fixtures.

**Test cases:**
- `test_detects_each_solfege_syllable()` — for each of the 7 syllable .mp3 files, load audio as numpy array, run SolfegeDetector.detect(), assert the correct syllable is returned with confidence > 0.5
- `test_ignores_background_chatter()` — load chatter.mp3, run detection, assert no solfege syllable is detected above threshold
- `test_detects_syllable_in_noisy_audio()` — load do_with_noise.mp3, run detection, assert "do" is still detected despite background noise

**Implementation notes:**
- Tests use SolfegeDetector directly (no server needed)
- Load .mp3 files via soundfile or librosa into numpy arrays
- Use a shared detector fixture (pytest fixture with session scope) to avoid reloading the model per test
- Mark as integration tests (slow) — model loading takes several seconds

**Also:** Replace `tests/test_app.py` with a basic smoke test for the new modules (import test, AudioBuffer unit test).

**Files to create:** `lib-py/solfege_detector/tests/test_integration.py`
**Files to modify:** `lib-py/solfege_detector/tests/test_app.py`
