Introduce a `NoteAudioCapture` ref in `useAudioStream` that can be started/stopped independently of the existing 250ms streaming chunks. When active, it collects Float32 samples in parallel with the main audio pipeline.

## Requirements
- Expose `startNoteCapture()` method that begins accumulating samples
- Expose `stopNoteCapture(): ArrayBuffer` method that returns Int16 PCM of only the captured window
- Samples collected from the existing ScriptProcessorNode's onaudioprocess callback
- Does not interfere with the existing 250ms chunk streaming to the backend

## Files
- `test-client/src/hooks/useAudioStream.ts`

## Acceptance Criteria
- startNoteCapture/stopNoteCapture API available from the hook
- Captured audio duration matches start/stop timing (±1 buffer size tolerance of ~93ms)
- PCM output is Int16, mono, 44100Hz — same format as existing chunks

