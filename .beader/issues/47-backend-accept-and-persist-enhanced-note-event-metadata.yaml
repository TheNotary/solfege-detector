Modify lib-py/solfege_detector/server.py and lib-py/solfege_detector/recorder.py to accept and persist the new metadata fields.

Server changes (server.py):
- Parse fft_pitch_hz (float, optional) and target_frequency_hz (float, optional) from incoming note_event JSON messages
- Pass these fields through to the RecordingBuffer when triggering a capture

Recorder changes (recorder.py):
- Accept fft_pitch_hz, target_frequency_hz, and client_ip as parameters in the capture/save method
- Include all three fields in the .metadata JSON output alongside existing fields (syllable, timestamp, hit, sample_rate, channels, duration_seconds)

New .metadata format example:
{
  "syllable": "do",
  "timestamp": "2026-05-14T13:12:50.577408+00:00",
  "hit": true,
  "sample_rate": 44100,
  "channels": 1,
  "duration_seconds": 3.0,
  "client_ip": "192.168.1.100",
  "fft_pitch_hz": 132.5,
  "target_frequency_hz": 130.81
}

Depends on issue 46 (client IP capture) for the IP field.

