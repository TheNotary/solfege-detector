Create `accoustic-model/prompt_config.py` defining the text prompts used for CLAP zero-shot classification. This replaces traditional model training — prompt engineering is the "training" step.

**Solfege prompts (7):** One prompt per syllable using a template like `"someone singing the solfege syllable {X}"` for do, re, mi, fa, sol, la, ti.

**Negative-class prompts (3):** `"background noise"`, `"people talking"`, `"silence"` — used to reject non-solfege audio and reduce false positives.

The config should export prompt lists that can be imported by both the detection library and the standalone test script.

**Files to create:** `accoustic-model/prompt_config.py`

