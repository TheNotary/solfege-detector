In lib-py/solfege_detector/audio_buffer.py, change the default parameters:
- window_size_seconds: 7.0 -> 1.5 (line ~18)
- hop_size_seconds: 1.0 -> 0.25 (line ~19)

The buffer math (window_samples, hop_samples) is already computed from these parameters, so only the defaults need to change.

### Rationale
- 1.5s window: enough audio context for CLAP to classify a solfege syllable while reducing time-to-first-detection from 7s to ~1.5s
- 250ms hop: model invoked ~4 times/second at steady state, matching user requirement

### Acceptance Criteria
- AudioBuffer yields its first window after ~1.5s of audio (not 7s)
- Subsequent windows are yielded every ~250ms of new audio
- Existing tests still pass

