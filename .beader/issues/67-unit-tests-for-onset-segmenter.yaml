Write unit tests for the onset_segmenter module to validate correctness of syllable boundary detection.

## Requirements
- New test file: `lib-py/solfege_detector/tests/test_onset_segmenter.py`
- Test cases:
  1. **Multi-syllable audio**: Generate synthetic audio with 2-3 sine tone bursts at known offsets (e.g., 0.2s, 0.6s, 1.1s). Verify `segment_onsets()` returns 3 segments within ±50ms of expected boundaries.
  2. **Single syllable**: Single tone burst. Verify returns 1 segment.
  3. **Silence**: All-zeros array. Verify returns 1 segment spanning the entire window.
  4. **Continuous tone (no onset)**: Constant sine wave. Verify returns 1 segment.
  5. **Closely spaced onsets**: Two bursts separated by less than `min_gap_seconds`. Verify they are treated as one segment (debounce works).
- Use numpy to generate synthetic test audio (sine bursts with fade-in/out envelopes)

## Files
- `lib-py/solfege_detector/tests/test_onset_segmenter.py` (new)

## Dependencies
- Depends on: #60 (onset_segmenter must be implemented)

