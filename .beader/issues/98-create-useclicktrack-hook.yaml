Create hooks/useClickTrack.ts — encapsulates Web Audio API click synthesis for the audio calibration. Uses OscillatorNode (1000 Hz sine wave, 20ms duration) connected to a GainNode with a fast envelope (attack 1ms, release 19ms) for a percussive pop sound. API: start() begins playing clicks at configurable interval (default 600ms), stop() halts playback, onClick(audioContextTime: number) callback fires for each click with the precise AudioContext.currentTime. Accepts intervalMs and totalClicks as config. Cleans up AudioContext resources on stop/unmount.

