Update the WebSocket note_event message format to include FFT pitch data.

Frontend changes (test-client/src/hooks/useWebSocket.ts):
- Update sendNoteEvent() to accept and send two additional fields:
  - fft_pitch_hz: number (detected fundamental frequency from pitchy at time of hit)
  - target_frequency_hz: number (expected Hz for the target syllable)
- Update the message type/interface

Frontend changes (test-client/src/hooks/useGameEngine.ts):
- Each GameNote should carry its target_frequency_hz based on C3 reference:
  do=130.81, re=146.83, mi=164.81, fa=174.61, sol=196.00, la=220.00, ti=246.94
- Return target_frequency_hz from checkHit()

The fft_pitch_hz value comes from usePitchDetection (shared with pitch indicator bar), read at the moment a hit is registered.

Depends on quality gate integration (issue 44) for the sending logic.

