Set up vitest in `test-client/` and write unit tests for the hitzone geometry function extracted in #103.

## Setup Steps
1. `pnpm add -D vitest` in `test-client/`
2. Add `"test": "vitest run"` to `package.json` scripts
3. Add vitest config to `vite.config.ts`: `test: { globals: true, environment: 'node' }`

## Test File
Create `test-client/src/lib/hitZoneGeometry.test.ts` with these tests:

1. **"offset is zero when latency is zero"** — assert `offsetPct === 0` and `effectiveCenter === CROSSHAIR_X` when `audioLatencyMs` and `displayLatencyMs` are both 0.

2. **"positive latency shifts debug-hitzone to the right"** — with realistic latency (e.g. 200ms audio + 50ms display at 30 BPM), assert `offsetPct > 0` and `effectiveCenter > CROSSHAIR_X`.

3. **"offset is ~25% of zone width at typical latency"** — find latency values where `offsetPct / (halfPct * 2) ≈ 0.25` and assert within tolerance. This captures the observed behavior where the debug-hitzone is offset ~25% of the zone width to the right.

4. **"offset scales linearly with latency"** — double the latency → double the `offsetPct`.

5. **"offset scales inversely with BPM"** — higher BPM → smaller `offsetPct` for the same latency.

## Acceptance Criteria
- `pnpm test` runs and all 5 tests pass
- `pnpm build` still succeeds (no type errors)

