Create test-client/src/hooks/useClickMask.ts. Pure logic, no Web Audio.

API:
- recordClick(clickAudioTime: number): pushes window [clickAudioTime + delaySec - leadGuardSec, clickAudioTime + delaySec + maskDurationSec]
- isMaskedAt(audioTime: number): boolean — linear scan with cheap GC of windows whose endAudioTime < audioTime - 1s
- clear(): resets the window store

Inputs (live-readable via getters / opts so calibration changes apply on the NEXT recorded click without rebuilding state):
- getDelayMs: () => number  (caller passes () => settings.audioLatencyMs)
- maskDurationMs (default 80)
- leadGuardMs (default 10)

Plus test-client/src/hooks/useClickMask.test.ts (vitest):
- recordClick + isMaskedAt: true inside window, false just before/after
- GC: windows older than 1s past the current query time are dropped
- delay change mid-stream affects only subsequently-recorded clicks
- multiple overlapping windows behave correctly

Defaults rationale: click envelope ~20 ms (ATTACK_SEC + RELEASE_SEC + STOP_PADDING_SEC in useMetronome) + small-room reverb tail ~30-60 ms. leadGuard absorbs cross-corr peak jitter.

