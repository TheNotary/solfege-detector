Add a 100ms sliding-window pitch average and display it in the debug HUD as a labeled span.

Implementation:
- Use a useRef<Array<{hz: number, t: number}>> ring buffer in GameView
- In a useEffect triggered by pitchHz changes: push {hz: pitchHz, t: performance.now()} (skip nulls), prune entries older than 100ms, compute arithmetic mean
- Store the averaged value in state: avgPitchHz (number | null)
- Add a labeled span inside .debug-hud: <span className="debug-pitch">Pitch: {avgPitchHz ? avgPitchHz.toFixed(1) + " Hz" : "—"}</span>
- Use raw pitchHz from usePitchDetection (not the spring-damped displayPitchHz) to avoid lag distortion

Files: test-client/src/views/GameView.tsx

