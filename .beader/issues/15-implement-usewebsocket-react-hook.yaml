Create `test-client/src/hooks/useWebSocket.ts` — custom React hook for WebSocket communication with the solfege detection server.

**API:**
- `useWebSocket(url: string)` returns:
  - `send(data: Blob | ArrayBuffer)` — send binary audio data
  - `sendConfig(config: { confidence_threshold: number })` — send JSON config message
  - `lastMessage: DetectionMessage | null` — last received detection event
  - `isConnected: boolean` — connection status
  - `connect()` / `disconnect()` — manual connection control

**Behavior:**
- Connects to the WebSocket URL on mount (default from AppConfig.SOCKET_URL)
- Auto-reconnects on disconnect with exponential backoff
- Parses incoming JSON text messages as detection events: `{ type: "detection", syllable: string, confidence: number }`
- Handles binary and text message types from server

**Files to create:** `test-client/src/hooks/useWebSocket.ts`
**Depends on:** #14 (CRUD cleanup, so App.tsx is clean)

