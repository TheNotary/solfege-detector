In lib-py/solfege_detector/server.py, add debug logging throughout the WebSocket handler to trace the inference lifecycle.

### Log Points
1. When buffer.append() yields a window: log window shape and buffer state
2. When inference starts: log 'Starting inference on window...'
3. When inference completes: log elapsed time and number of detections
4. When a window is skipped due to ongoing inference: log 'Window skipped (inference in progress), stashing as pending'
5. When a pending window is picked up after inference completes: log 'Processing pending window...'
6. When detections are sent to the client: log syllable and confidence for each detection

### Acceptance Criteria
- Full inference lifecycle is traceable in DEBUG logs
- Skipped windows are explicitly logged
- Logs only appear at DEBUG level

