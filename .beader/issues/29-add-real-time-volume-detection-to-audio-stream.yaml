Add RMS volume detection to the existing audio pipeline so the game can detect when the player is making sound (for instant confetti feedback).

## Changes

### Modify: test-client/src/hooks/useAudioStream.ts
- Add optional `onVolume?: (rms: number) => void` parameter to `startRecording()`
- In the `ScriptProcessorNode` `onaudioprocess` handler, compute RMS of the float32 input buffer and call `onVolume(rms)` each frame
- This provides real-time volume data without creating a second AudioContext/microphone stream

### New: test-client/src/hooks/useVolumeDetection.ts
- Create `useVolumeDetection` hook that wraps the `onVolume` callback to provide reactive state
- Expose: `{ volume: number, isSounding: boolean }` where `isSounding = volume > threshold`
- Threshold is a constant (~0.02 RMS) — just "is there sound?", not pitch detection
- This is used by the game engine for hit detection

## Design
- Taps into the existing AudioContext/ScriptProcessorNode from useAudioStream — avoids creating a second microphone stream
- RMS computed on every onaudioprocess frame for minimal latency
- Client-side only — no backend round-trip for confetti triggering

