Wired the click mask end-to-end inside GameView.tsx:

- Created a `clickMask` store via `useClickMask({ getDelayMs: () => audioLatencyMsRef.current })`, plus mirror refs (`audioContextRef`, `clickMaskEnabledRef`, `audioLatencyMsRef`) so the hot callbacks don't rebuild on every settings update.
- All four display-side callbacks (`onVolumeRaw`, `onVolumeFilteredCb`, `feedSamplesRaw`, `feedSamplesFiltered`) now invoke a shared `isClickMaskedNow` helper *after* the existing `filteredActiveRef` dedup but *before* forwarding to `onVolume` / `feedSamples`, preserving AEC raw/filtered ordering while suppressing predicted click-arrival samples.
- Both `metronome.start({…})` sites (handleToggle + live-toggle effect) pass `onClickScheduled: (audioTime) => clickMask.recordClick(audioTime)` (gated on `clickMaskEnabledRef`).
- `clickMask.clear()` runs adjacent to all three `metronome.stop()` paths (handleToggle, live-toggle effect, Esc handler) and in a dedicated effect when `settings.clickMaskEnabled` flips false.
- Added an effect to mirror the live `AudioContext` into `audioContextRef` so the per-callback `isMaskedAt(ctx.currentTime)` check stays cheap and lock-free.

Verification:
- `pnpm exec tsc -b` → only the pre-existing TS6133 unused-symbol warnings (in unrelated files); no new errors.
- `pnpm test --run` → 36/37 passing; the one failure (`delayCalibration.test.ts > recovers a delay from a sustained drone reference`) is a flaky pre-existing test that passes when run alone — unrelated to this change.
