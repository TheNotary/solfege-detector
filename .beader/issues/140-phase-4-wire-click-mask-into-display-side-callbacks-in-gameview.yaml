In test-client/src/views/GameView.tsx:

1. Instantiate: const clickMask = useClickMask({ getDelayMs: () => settings.audioLatencyMs, maskDurationMs: 80, leadGuardMs: 10 });

2. Pass onClickScheduled into BOTH metronome.start({...}) sites:
   onClickScheduled: (t) => { if (settings.clickMaskEnabled) clickMask.recordClick(t); }

3. When metronome.stop() runs or settings.clickMaskEnabled flips off, call clickMask.clear().

4. Short-circuit the four display-side callbacks when masked:
   - onVolumeRaw / onVolumeFilteredCb: if audioContext && clickMask.isMaskedAt(audioContext.currentTime), return early before calling onVolume.
   - feedSamplesRaw / feedSamplesFiltered: same gate before calling feedSamples.
   - Preserve the existing filteredActiveRef dedup order (mask check happens AFTER the dedup flip but BEFORE the consumer call).

Depends on Phases 1, 2, 3.

