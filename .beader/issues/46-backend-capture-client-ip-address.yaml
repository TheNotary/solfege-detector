Modify lib-py/solfege_detector/server.py to capture the connecting client's IP address.

Changes:
- At WebSocket connection time, extract client IP from websocket.client.host (Starlette WebSocket object)
- Store the IP in connection-level state (variable accessible throughout the WS handler)
- Pass client_ip to the RecordingBuffer/recorder when saving recordings
- Add client_ip field to .metadata JSON files

Note: If behind a reverse proxy, consider X-Forwarded-For header. For now, direct connection IP is sufficient.

This is backend-only work and can proceed independently of frontend changes.

