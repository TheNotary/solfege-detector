In lib-py/solfege_detector/server.py, wrap the _detector.detect() call (line ~63) in asyncio.to_thread() so that CLAP model inference runs in a background thread and does not block the async WebSocket receive loop.

### Current Problem
The detect() call is synchronous and runs directly in the async handler. While inference is running (potentially hundreds of ms on CPU), the WebSocket cannot receive new audio chunks -- they queue up in the socket buffer.

### Implementation
Change:
  detections = _detector.detect(window, ...)
To:
  detections = await asyncio.to_thread(_detector.detect, window, ...)

Import asyncio at the top of the file.

### Acceptance Criteria
- Model inference runs in a thread, not blocking the event loop
- WebSocket continues receiving audio during inference
- Detection results are still sent correctly to the client

