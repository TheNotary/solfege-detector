In lib-py/solfege_detector/main.py, add logging configuration that respects a LOG_LEVEL environment variable.

### Implementation
- Read LOG_LEVEL from os.environ (default to 'INFO')
- Configure logging.basicConfig() with that level, a format string that includes timestamp, logger name, and level, e.g.:
  logging.basicConfig(level=getattr(logging, os.environ.get('LOG_LEVEL', 'INFO').upper(), logging.INFO), format='%(asctime)s %(name)s %(levelname)s %(message)s')
- This enables all the debug logging added in issues #22, #23, #24 when the server is started with LOG_LEVEL=DEBUG

### Acceptance Criteria
- Starting the server with LOG_LEVEL=DEBUG shows debug-level log messages from all solfege_detector modules
- Default behavior (no env var) shows only INFO and above
- Log format includes timestamp and module name for easy debugging

