User runs in Chrome with real mic + speakers. Implementer (next session) instructs one case at a time and waits for the user to report results.

Cases:
1. Metronome ONLY @ 120 BPM, no drone, no singing → zero confetti, zero OnsetFlash, waveform cyan trace shows visible blanked dips once per beat.
2. Same @ 60 BPM and @ 200 BPM → mask follows clicks at any tempo (no drift, no missed beats).
3. Metronome + singing → confetti fires on each sung syllable, NOT on click-only beats. Sung notes that overlap a beat may briefly dip — note user feedback.
4. Drone + metronome + singing → no regression vs. today for drone cancellation (still 20+ dB); clicks still masked.
5. Toggle clickMaskEnabled OFF in ConfigView → clicks DO trigger spurious hits (today's baseline). Proves the toggle is the only path-altering change.
6. Move audioLatencyMs slider mid-session by +/- 20 ms → mask realigns within one beat (no restart needed).

When all six pass, close this issue and add a comment to #135 noting that the user-visible bug was fixed via consumer-side gating in #136 rather than improving AEC FIR convergence (so #135 remains valid follow-up for waveform-level click cancellation if needed later).

Also revisit #125 (existing manual verification task on #118) — its checks should still pass since this work is purely additive on top of #118.

