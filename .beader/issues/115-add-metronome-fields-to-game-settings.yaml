Extend `test-client/src/hooks/useGameSettings.ts` `GameSettings` interface and `DEFAULTS` constant with three new persisted fields:

- `metronomeEnabled: boolean` — default `true`. The metronome is on out of the box because the user explicitly asked for it to help with timing.
- `metronomeVolume: number` — default `0.25`. Expected UI range `0..0.6`.
- `metronomeOffsetMs: number` — default `0`. Expected UI range `-200..+200` (ms). Independent of the existing calibrated `audioLatencyMs` / `displayLatencyMs` because those measure mic-input and visual-display latency, not audio-output latency.

No other changes — the settings store already handles persistence and change notifications via `useSyncExternalStore`. Existing readers ignore unknown new fields because `readFromStorage` spreads defaults first.

**Out of scope:** wiring these fields into any UI or hook — done in the GameView integration task.

**Acceptance:** `pnpm --filter test-client typecheck` clean; loading the app on a browser that has an older `solfege-settings` localStorage value still works (defaults backfill).

