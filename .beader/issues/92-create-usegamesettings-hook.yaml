Create hooks/useGameSettings.ts — a custom React hook backed by localStorage that stores and retrieves game settings:
- speed (BPM, default 30)
- acceleration (responsiveness, default 1.0)
- rootNote (string, default 'E3')
- droneVolume (number, default 0.15)
- showDebug (boolean, default true)
- audioLatencyMs (number, default 0 — written by calibration)
- displayLatencyMs (number, default 0 — written by calibration)

Exposes: settings object, updateSetting(key, value), resetToDefaults(). Reads from localStorage on mount, writes on update. Use a single localStorage key (e.g., 'solfege-settings') storing a JSON object.

