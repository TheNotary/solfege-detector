Implemented in c2898ad. Worklet at `test-client/public/aec-processor.js` (registered as `aec-processor`); pure-TS twin at `src/lib/aecCore.ts` (same NLMS, double-talk gate, ring-buffer delay) tested in `aecCore.test.ts`. Cancellation test: 130.81 Hz reference delayed 18 ms / attenuated 0.5 -> residual drops >=20 dB within 2 s. Voice preservation test: 440 Hz burst at t=3 s sits within 3 dB of raw voice RMS in the output. Default double-talk ratio tightened from 4 -> 1.5 (in steady-state leakage mic energy stays below ref energy because leakage gain <= 1; the moment mic exceeds ref the user is singing). Worklet is shipped to `dist/aec-processor.js` by vite. No consumers yet -- Phase 3 (#121) wires it into useAudioStream.
