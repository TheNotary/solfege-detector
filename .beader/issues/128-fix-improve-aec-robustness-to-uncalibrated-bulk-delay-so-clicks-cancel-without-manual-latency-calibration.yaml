COMMENT
2026-05-18T01:05:47.183974969Z
author: witty-falcon

Auto-calibration shipped. Cross-correlation lib + 7 unit tests, captureWindow protocol added to AEC worklet, calibrateBulkDelay() callback wired into useAudioStream, and GameView auto-fires it 700ms after AEC startup. End-to-end regression in aecCore.test.ts shows click cancellation jumps from ~3 dB to ~30 dB once the calibrated delay is applied. Production min-confidence set to 1.5 to handle drone-dominated probe windows. Manual /calibrate is still available as override; measured value persists to audioLatencyMs for next session. 25/25 vitest, 4/4 playwright, build clean.
