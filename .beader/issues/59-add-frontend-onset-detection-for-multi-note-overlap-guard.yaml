Add an energy-envelope onset detector that marks syllable boundaries using RMS spikes from the existing AnalyserNode. When multiple onsets are detected within a single note's capture window, trim the audio to keep only the segment around the onset closest to the crosshair center (x=20%).

## Requirements
- New hook: `useOnsetDetection` consuming the shared AnalyserNode's time-domain data
- Detect onsets via RMS energy derivative (spike detection)
- Configurable: `ONSET_THRESHOLD` (RMS derivative threshold), `MIN_ONSET_GAP_MS` (debounce, default ~100ms)
- Expose `getOnsets(): Array<{timeMs: number, rmsEnergy: number}>` for the current capture window
- Provide a `trimToNearestOnset(audioBuffer, targetTimeMs): ArrayBuffer` utility
- Integrate with stopNoteCapture flow: if multiple onsets detected, trim before returning

## Files
- `test-client/src/hooks/useOnsetDetection.ts` (new)
- Integration point: `test-client/src/hooks/useAudioStream.ts` (stopNoteCapture calls trim)

## Dependencies
- Depends on: #56 (needs the per-note capture accumulator to trim)

