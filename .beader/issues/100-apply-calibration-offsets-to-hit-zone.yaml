Modify useGameEngine.ts hit-zone logic to incorporate calibration offsets. Currently uses CROSSHAIR_X +/- HIT_ZONE_HALF as a spatial window. With calibration:
1. Read audioLatencyMs and displayLatencyMs from useGameSettings at game start
2. Compute totalLatencyMs = audioLatencyMs + displayLatencyMs
3. Convert to pixel offset: totalOffsetPx = totalLatencyMs * noteSpeedPxPerMs (derived from current BPM and travel distance)
4. Shift effective hit-zone center: effectiveCenterX = CROSSHAIR_X - totalOffsetPx
5. Notes are evaluated for hits slightly before they visually reach the crosshair, compensating for system + player latency
6. Handle negative offsets (anticipation) — shifts in the opposite direction

