Add a method to the WebSocket hook for sending note events to the backend when notes reach the crosshair zone.

## Modify: test-client/src/hooks/useWebSocket.ts
- Add `sendNoteEvent(syllable: string, hit: boolean)` method
- Sends JSON message: `{ type: "note_event", syllable: "do", hit: true, timestamp: "<ISO8601>" }`
- Timestamp generated client-side at the moment of the event
- Called by GameView when a note reaches the crosshair zone (whether hit or missed)
- Backend uses this to trigger audio recording capture

