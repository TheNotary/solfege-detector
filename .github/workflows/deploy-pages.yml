name: Deploy test-client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'test-client/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: test-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: test-client
        run: pnpm install --frozen-lockfile

      - name: Create .env.build
        working-directory: .
        run: |
          cat > .env.build << 'EOF'
          export VITE_APP_TEST_CLIENT_APP_ENV=prod
          export VITE_APP_TEST_CLIENT_BUILD_VERSION=${{ github.sha }}
          export VITE_APP_TEST_CLIENT_SOCKET_URL=
          export VITE_APP_TEST_CLIENT_BACKEND_URL=
          EOF

      - name: Build
        working-directory: test-client
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: test-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
